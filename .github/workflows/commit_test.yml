name: commit release

on:
  push:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: Alacritty-windows-portable
          path: ./target/release/alacritty.exe
      - name: Install WiX
        run: dotnet tool install --global wix --version 4.0.5
      - name: Create msi installer
        run: |
          wix extension add WixToolset.UI.wixext/4.0.5 WixToolset.Util.wixext/4.0.5
          wix build -arch "x64" -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext \
          -out "./Alacritty-installer.msi" "alacritty/windows/wix/alacritty.wxs"
      - name: Upload msi installer
        uses: actions/upload-artifact@v4
        with:
          name: Alacritty-windows-msi
          path: ./Alacritty-installer.msi

  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install cmake pkg-config libfreetype6-dev libfontconfig1-dev \
            libxcb-xfixes0-dev libxkbcommon-dev python3 scdoc
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Upload linux binary
        uses: actions/upload-artifact@v4
        with:
          name: Alacritty-linux-binary
          path: ./target/release/alacritty
      - name: Generate manpages
        run: |
          scdoc < extra/man/alacritty.1.scd | gzip -c > "./alacritty.1.gz"
          scdoc < extra/man/alacritty-msg.1.scd | gzip -c > "./alacritty-msg.1.gz"
          scdoc < extra/man/alacritty.5.scd | gzip -c > "./alacritty.5.gz"
          scdoc < extra/man/alacritty-bindings.5.scd | gzip -c > "./alacritty-bindings.5.gz"
          scdoc < extra/man/alacritty-escapes.7.scd | gzip -c > "./alacritty-escapes.7.gz"
      - name: Upload Assets
        uses: actions/upload-artifact@v4
        with:
          name: Alacritty-linux-assets
          path: |
            extra/logo/alacritty-term.svg
            alacritty.1.gz
            alacritty-msg.1.gz
            alacritty.5.gz
            alacritty-bindings.5.gz
            alacritty-escapes.7.gz
            extra/completions/alacritty.bash
            extra/completions/alacritty.fish
            extra/completions/_alacritty
            extra/linux/Alacritty.desktop
            extra/alacritty.info